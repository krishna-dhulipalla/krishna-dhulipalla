<svg xmlns="http://www.w3.org/2000/svg" width="960" height="80" viewBox="0 0 960 80" role="img" aria-labelledby="title">
<title id="title">Orange signal flowing between nodes</title>
<style>
  .packet { animation: travel 2.8s ease-in-out 3; }
  .echo { animation: travel 2.8s .35s ease-in-out 3; }
  @keyframes travel {
    0% { transform: translateX(0); opacity: 0; }
    14% { opacity: 1; }
    86% { opacity: 1; }
    100% { transform: translateX(712px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .packet, .echo { animation: none; } }
</style>
<rect x="1" y="1" width="958" height="78" rx="16" fill="#231d1a" stroke="#694235"/>
<path d="M124 40H836" stroke="#794b3d" stroke-width="2"/>
<g fill="#231d1a" stroke="#d97757" stroke-width="2">
  <circle cx="124" cy="40" r="7"/><circle cx="302" cy="40" r="7"/>
  <circle cx="480" cy="40" r="7"/><circle cx="658" cy="40" r="7"/>
  <circle cx="836" cy="40" r="7"/>
</g>
<circle cx="124" cy="40" r="4" fill="#d97757" opacity=".48" class="echo"/>
<circle cx="124" cy="40" r="4" fill="#ffab8e" class="packet"/>
</svg>
